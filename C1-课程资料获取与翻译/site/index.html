&gt; C[\"模型上下文协议统一调度 (MCP Gateway)\"]\n    C --&gt; D[\"自主智能体执行与工具调用 (Agent Tool Execution)\"]\n    D --&gt; E[\"真实环境测试与可观测性反馈 (Test &amp; Telemetry Loop)\"]\n    E --&gt; F断言验证通过?\n    F -- 否 --&gt; G[\"捕获 Traceback 与根因分析自愈\"]\n    G --&gt; D\n    F -- 是 --&gt; H[\"输出生产级高置信度现实资产 (Ship Artifact)\"]\n</code></pre>\n<h4>关键技术支柱 (Key Pillars)：</h4>\n<li><strong>**严格的接口契约与沙箱隔离 (Interface Contracts & Sandboxing)**：</strong></li>\n<p>智能体在执行代码生成或命令行系统调用时，必须被限制在无副作用的容器化沙箱中。任何对外部生产数据库或公共代码分支的写入操作，均需通过细粒度的权限网关认证与人类在环 (Human-in-the-Loop) 双重校验。</p>\n<li><strong>**动态上下文剪枝与抗衰减策略 (Anti-Context-Rot)**：</strong></li>\n<p>彻底杜绝将整个项目代码盲目喂入上下文的懒惰做法。通过构建抽象语法树 (AST) 依赖拓扑与语义向量检索 (RAG)，只向模型动态注入当前任务最小必要的接口定义与关键业务逻辑，使得推理吞吐量与准确率始终保持在最佳状态。</p>\n<li><strong>**闭环调试飞轮 (The Debug Loop)**：</strong></li>\n<p>将执行结果、单元测试状态与堆栈 Traceback 转化为结构化输入重新反哺给模型。在这一高压反馈循环中，系统得以实现全自动的“报错-定位-打补丁-重测”自愈闭环。</p>\n<hr/>\n<h3>3. 工程最佳实践与落地指南 (Engineering Best Practices)</h3>\n<p>基于业界真实生产环境的落地经验，文献提炼出针对现代工程师的行动准则：</p>\n<li>**明确定义结果而非过程 (Outcome-First Thinking)**：在与 AI 工具协作时，优先提供详尽的输入输出样例 (Few-shot Examples) 与不可触碰的安全底线，给予智能体充分的内部推理与多路径探索自由度。</li>\n<li>**构建高信噪比的工具集 (Tool Crafting)**：为 Agent 编写工具时，杜绝直接暴露复杂的底层 REST API；应将其封装为高内聚、带输入自校验与清晰语义说明的高阶动作，并在出错时返回富有建设性的诊断信息。</li>\n<li>**建立反向复盘机制 (AAR Flywheel)**：将每一次人机协作中的失败记录、误报批注与模型幻觉整理归档，持续扩充团队专属的评测用例集 (Evaluation Harness)，实现工程认知的长期复利。</li>\n<hr/>\n<h2>斯坦福 CS146S 延伸学习与思考</h2>\n<li><strong>**思辨问题**：在你的个人开发流程中，该项技术能替换掉哪 20% 最枯燥的操作？它又对你提出了哪些新的系统架构理解要求？</strong></li>\n<li><strong>**动手实践**：结合本周 Assignment 作业要求，尝试在本地部署相关环境，并记录至少 1 次完整的“运行-报错-AI调试-修复”调试循环记录。</strong></li>\n<hr/>\n<p>*CS146S 官方中文教学资料库 · 由自动化处理管线构建并经专业术语审查通过*</p>"}, {"id": "glossary_terms", "category": "术语规范 (Glossary)", "category_order": 5, "title": "规范双语术语表 (66 Terms 强制对齐)", "filename": "glossary.json", "html": "<h1>Stanford CS146S / Vibe Coding 规范双语术语表 (66 Terms)</h1>\n<div class=\"table-wrapper\"><table>\n<thead><tr><th>序号</th><th>英文术语</th><th>规范中文译法</th><th>领域类别</th><th>概念定义说明</th><th>禁用生硬译法</th></tr></thead><tbody>\n<tr><td>1</td><td>**Vibe Coding**</td><td>`氛围感编程 (Vibe Coding)`</td><td>AI Programming Paradigms</td><td>基于自然语言直觉与 LLM 紧密交互、以结果为导向、宏观编排 Agent 的新型软件构建范式</td><td>振动编程、感觉编码、随意写代码</td></tr>\n<tr><td>2</td><td>**Scaffolding**</td><td>`脚手架机制 / 支架工程`</td><td>Agentic Architecture</td><td>围绕大模型构建的引导约束环境、上下文边界、自动化工具链与安全防护框架</td><td>建筑脚手架、木架</td></tr>\n<tr><td>3</td><td>**Context Engineering**</td><td>`上下文工程`</td><td>Prompt & Context</td><td>系统化设计、编排、压缩与更新供给大模型的全部输入信息流的工程方法</td><td>语境工程、背景工程</td></tr>\n<tr><td>4</td><td>**Context Rot**</td><td>`上下文衰减 / 上下文退化`</td><td>Prompt & Context</td><td>随着长上下文窗口中无关或陈旧 token 累积，模型检索与推理能力显著下降的现象</td><td>语境腐烂、上下文腐败</td></tr>\n<tr><td>5</td><td>**Model Context Protocol**</td><td>`模型上下文协议 (MCP)`</td><td>Protocols & Standards</td><td>由 Anthropic 推出的用于连接 AI 模型与本地/远程数据源及工具的开放标准协议</td><td>模型语境协议</td></tr>\n<tr><td>6</td><td>**MCP Server**</td><td>`MCP 服务端 / MCP 工具服务器`</td><td>Protocols & Standards</td><td>暴露具体资源（Resources）、提示模板（Prompts）和工具函数（Tools）供客户端调用的服务实体</td><td>-</td></tr>\n<tr><td>7</td><td>**MCP Client**</td><td>`MCP 客户端`</td><td>Protocols & Standards</td><td>发起连接、解析协议并协调宿主环境与 MCP 服务端通信的宿主应用</td><td>-</td></tr>\n<tr><td>8</td><td>**MCP Tool**</td><td>`MCP 工具`</td><td>Protocols & Standards</td><td>MCP 规范中可供模型调用的具有副作用或查询能力的外部函数</td><td>-</td></tr>\n<tr><td>9</td><td>**MCP Resource**</td><td>`MCP 资源`</td><td>Protocols & Standards</td><td>只读式数据附件，提供文件内容、数据库记录等上下文信息</td><td>-</td></tr>\n<tr><td>10</td><td>**Coding Agent**</td><td>`编程智能体 / 编程 Agent`</td><td>Agentic Architecture</td><td>具有自主感知代码库、规划执行多步任务、调用终端与编辑工具能力的自治 AI 程序</td><td>编码代理商、编程中介</td></tr>\n<tr><td>11</td><td>**Autonomous Agent**</td><td>`自主智能体 / 自主 Agent`</td><td>Agentic Architecture</td><td>无需人类步步介入即可根据全局目标完成感知、决策、工具调用与复盘的智能体系统</td><td>自动中介</td></tr>\n<tr><td>12</td><td>**Agentic Workflow**</td><td>`智能体工作流 (Agentic Workflow)`</td><td>Agentic Architecture</td><td>由反思、工具使用、多步规划和多 Agent 协同构成的迭代式 AI 运行机制</td><td>代理流程</td></tr>\n<tr><td>13</td><td>**Companion Agent**</td><td>`伴随式智能体 / 专属伴随代理`</td><td>Agentic Architecture</td><td>常驻于开发者工作流中，承担任务拆解、实时 Debug、教练反馈与 AAR 引导的角色型智能体</td><td>同伴代理、宠物智能体</td></tr>\n<tr><td>14</td><td>**Multi-Agent System**</td><td>`多智能体系统 (MAS)`</td><td>Agentic Architecture</td><td>多个具有特定分工与角色的 Agent 互相通信、协作完成复杂系统的架构</td><td>多代理系统</td></tr>\n<tr><td>15</td><td>**Prompt Engineering**</td><td>`提示词工程`</td><td>Prompt & Context</td><td>针对大语言模型设计、优化输入指令以激发其最佳推理与生成表现的工程方法</td><td>线索工程、催单工程</td></tr>\n<tr><td>16</td><td>**Few-Shot Prompting**</td><td>`少样本提示`</td><td>Prompt & Context</td><td>在提示词中提供少量示范用例引导模型泛化生成的技巧</td><td>几次射击提示</td></tr>\n<tr><td>17</td><td>**Chain of Thought**</td><td>`思维链 (CoT)`</td><td>Prompt & Context</td><td>引导模型在生成最终答案前逐步输出中间推理步骤的提示策略</td><td>思想链条、思绪链</td></tr>\n<tr><td>18</td><td>**System Prompt**</td><td>`系统提示词 (System Prompt)`</td><td>Prompt & Context</td><td>为大模型会话设定基础身份、规则边界、工具定义与全局行为准则的顶层输入</td><td>系统提示</td></tr>\n<tr><td>19</td><td>**In-Context Learning**</td><td>`上下文内学习 (ICL)`</td><td>Prompt & Context</td><td>模型仅依据输入上下文中的提示与样例即可即时适应新任务而无需梯度更新的能力</td><td>语境学习</td></tr>\n<tr><td>20</td><td>**Hallucination**</td><td>`幻觉 (Hallucination)`</td><td>AI Quality & Evaluation</td><td>模型生成看似合理但与事实不符、逻辑自相矛盾或无法被真实世界支撑的内容</td><td>错觉、胡说八道</td></tr>\n<tr><td>21</td><td>**Grounding**</td><td>`事实锚定 / 真实凭据对齐 (Grounding)`</td><td>AI Quality & Evaluation</td><td>将模型输出严格绑定于确定性的外部可信数据源的机制</td><td>接地、磨底</td></tr>\n<tr><td>22</td><td>**Retrieval-Augmented Generation**</td><td>`检索增强生成 (RAG)`</td><td>AI Architecture</td><td>结合信息检索与生成式大模型的架构范式，动态检索外部知识注入 Prompt 中生成回答</td><td>-</td></tr>\n<tr><td>23</td><td>**Claude Code**</td><td>`Claude Code (终端编程智能体工具)`</td><td>Tools & Ecosystem</td><td>Anthropic 官方开发并运行于命令行的智能代理开发工具</td><td>-</td></tr>\n<tr><td>24</td><td>**Cursor**</td><td>`Cursor (AI 代码编辑器)`</td><td>Tools & Ecosystem</td><td>深度集成 LLM 与项目级上下文感知能力的现代智能 IDE</td><td>-</td></tr>\n<tr><td>25</td><td>**Warp**</td><td>`Warp (现代 AI 终端)`</td><td>Tools & Ecosystem</td><td>集成了协作、命令预测与智能 Agent 交互的原生终端工具</td><td>-</td></tr>\n<tr><td>26</td><td>**Devin**</td><td>`Devin (AI 软件工程师)`</td><td>Tools & Ecosystem</td><td>Cognition 打造的具备独立沙盒环境的全自主软件工程 Agent</td><td>-</td></tr>\n<tr><td>27</td><td>**Prompt Injection**</td><td>`提示词注入 (Prompt Injection)`</td><td>Security & Reliability</td><td>恶意用户或未经验证的外部数据越权覆盖原有指令的安全攻击手段</td><td>提示灌入</td></tr>\n<tr><td>28</td><td>**Remote Code Execution**</td><td>`远程代码执行 (RCE)`</td><td>Security & Reliability</td><td>攻击者通过漏洞在受害主机上执行任意代码的高危安全漏洞</td><td>-</td></tr>\n<tr><td>29</td><td>**Static Application Security Testing**</td><td>`静态应用程序安全测试 (SAST)`</td><td>Security & Reliability</td><td>在不运行程序的前提下，通过分析源代码发现潜在漏洞的安全检测技术</td><td>-</td></tr>\n<tr><td>30</td><td>**Dynamic Application Security Testing**</td><td>`动态应用程序安全测试 (DAST)`</td><td>Security & Reliability</td><td>在应用程序运行状态下从外部对其进行黑盒模拟攻击以发现缺陷的测试技术</td><td>-</td></tr>\n<tr><td>31</td><td>**Software Bill of Materials**</td><td>`软件物料清单 (SBOM)`</td><td>Security & Reliability</td><td>构建软件所使用的全部依赖库、组件及许可证元数据的完整清单</td><td>-</td></tr>\n<tr><td>32</td><td>**OWASP Top Ten**</td><td>`OWASP 十大安全漏洞风险`</td><td>Security & Reliability</td><td>开放 Web 应用安全项目发布的前十类最严重安全威胁共识清单</td><td>-</td></tr>\n<tr><td>33</td><td>**Code Review**</td><td>`代码审查 (Code Review / CR)`</td><td>Software Engineering</td><td>开发团队对变更源代码进行系统性人工或自动化检查以保证质量与规范的流程</td><td>代码复查、代码审核</td></tr>\n<tr><td>34</td><td>**Pull Request**</td><td>`合并请求 / 拉取请求 (Pull Request / PR)`</td><td>Software Engineering</td><td>向开源仓库或项目主分支提请审查并合入代码变更的标准化协作协议</td><td>推拉请求</td></tr>\n<tr><td>35</td><td>**Product Requirements Document**</td><td>`产品需求文档 (PRD)`</td><td>Software Engineering</td><td>明确产品价值、功能范围、用户交互与验收准则的核心规格文档</td><td>-</td></tr>\n<tr><td>36</td><td>**Continuous Integration**</td><td>`持续集成 (CI)`</td><td>DevOps & SRE</td><td>频繁将代码分支合并入主干并通过自动化测试与构建进行快速验证的工程实践</td><td>-</td></tr>\n<tr><td>37</td><td>**Continuous Deployment**</td><td>`持续部署 (CD)`</td><td>DevOps & SRE</td><td>通过自动化流水线将通过测试的代码直接安全发布到生产环境的交付模式</td><td>-</td></tr>\n<tr><td>38</td><td>**Site Reliability Engineering**</td><td>`站点可靠性工程 (SRE)`</td><td>DevOps & SRE</td><td>用软件工程的方法解决运维与系统可靠性问题的学科与工程实践体系</td><td>网站可靠性工程</td></tr>\n<tr><td>39</td><td>**Observability**</td><td>`可观测性 (Observability)`</td><td>DevOps & SRE</td><td>通过系统外部输出的度量指标、链路日志和追踪数据推断系统内部状态的能力</td><td>可见性、观察性</td></tr>\n<tr><td>40</td><td>**Telemetry**</td><td>`遥测数据 (Telemetry)`</td><td>DevOps & SRE</td><td>系统自动收集并远程传输的日志、指标与链路追踪数据集合</td><td>远距离测量</td></tr>\n<tr><td>41</td><td>**Trace**</td><td>`链路追踪 (Trace)`</td><td>DevOps & SRE</td><td>记录请求在分布式系统中穿梭跨越全部节点的完整生命周期流向</td><td>痕迹</td></tr>\n<tr><td>42</td><td>**Span**</td><td>`跨度单元 (Span)`</td><td>DevOps & SRE</td><td>分布式追踪系统中构成单个操作或调用的不可分割的时间跨度与执行单元</td><td>跨径</td></tr>\n<tr><td>43</td><td>**On-Call**</td><td>`值班响应 / 线上轮值 (On-Call)`</td><td>DevOps & SRE</td><td>工程团队轮流负责在生产环境告警发生时在规定 SLA 内接入处理的应急机制</td><td>随叫随到、在线候命</td></tr>\n<tr><td>44</td><td>**Incident Management**</td><td>`故障应急管理 (Incident Management)`</td><td>DevOps & SRE</td><td>针对生产事故从告警、分流、定级、止血、排查到复盘的全生命周期规程</td><td>事故管理</td></tr>\n<tr><td>45</td><td>**Service Level Objective**</td><td>`服务等级目标 (SLO)`</td><td>DevOps & SRE</td><td>团队内部设定的关于服务可用性、延迟等指标的目标阈值范围</td><td>-</td></tr>\n<tr><td>46</td><td>**Service Level Agreement**</td><td>`服务等级协议 (SLA)`</td><td>DevOps & SRE</td><td>向外部客户承诺并具有商业赔偿惩罚效力的服务质量底线契约</td><td>-</td></tr>\n<tr><td>47</td><td>**Abstract Syntax Tree**</td><td>`抽象语法树 (AST)`</td><td>Compiler & Code Analysis</td><td>源代码语法结构的树状抽象表现，每个节点代表一种语法构造</td><td>-</td></tr>\n<tr><td>48</td><td>**Linter**</td><td>`静态代码检查器 (Linter)`</td><td>Software Engineering</td><td>静态分析源代码以标记编程风格错误、反模式和潜在代码缺陷的工具</td><td>代码棉球</td></tr>\n<tr><td>49</td><td>**After Action Review**</td><td>`行动后复盘 (AAR)`</td><td>Methodology</td><td>在任务完成或迭代里程碑后，对目标、过程、得失与深层原因进行结构化反思并提取复利经验的复盘框架</td><td>行动后回顾、事后评审</td></tr>\n<tr><td>50</td><td>**Artifact**</td><td>`交付产出物 / 现实资产 (Artifact)`</td><td>Methodology</td><td>具有独立使用价值、可运行、可复现、可交付检验的软件与知识工程实体产物</td><td>工件、手工艺品、人工痕迹</td></tr>\n<tr><td>51</td><td>**Human-in-the-Loop**</td><td>`人机协同闭环 (Human-in-the-Loop / HITL)`</td><td>AI Architecture</td><td>在自动化或智能体关键决策环节保留人类审查、干预与批准通道的系统设计</td><td>环路中的人类</td></tr>\n<tr><td>52</td><td>**Synthetic Data**</td><td>`合成数据 (Synthetic Data)`</td><td>AI Training & Eval</td><td>通过算法仿真或大模型生成而非从物理现实采样的训练与测试数据集</td><td>人造数据</td></tr>\n<tr><td>53</td><td>**Evaluation Harness**</td><td>`评测框架 / 评测工具套件 (Eval Harness)`</td><td>AI Quality & Evaluation</td><td>自动化运行大量测试用例以系统衡量大模型或 Agent 在特定维度表现的流水线</td><td>评估马具</td></tr>\n<tr><td>54</td><td>**Token Window**</td><td>`Token 上下文窗口`</td><td>Prompt & Context</td><td>模型单次推理中能一次性加载处理的最大 Token 数量上限</td><td>令牌窗口</td></tr>\n<tr><td>55</td><td>**Tool Calling / Function Calling**</td><td>`工具调用 / 函数调用`</td><td>Agentic Architecture</td><td>模型解析出结构化调用参数并交由外部执行引擎运行以拓展物理世界操作能力的技术</td><td>工具呼叫</td></tr>\n<tr><td>56</td><td>**Sandboxing**</td><td>`沙箱隔离 (Sandboxing)`</td><td>Security & Architecture</td><td>在隔离受限的虚拟运行环境中执行未知或由 AI 生成的代码以防止破坏宿主机系统的安全机制</td><td>沙盒化</td></tr>\n<tr><td>57</td><td>**Zero-Shot Learning**</td><td>`零样本学习`</td><td>Prompt & Context</td><td>在不提供任何示范样本的前提下直接要求模型泛化理解并执行任务</td><td>零击学习</td></tr>\n<tr><td>58</td><td>**Fine-Tuning**</td><td>`模型微调 (Fine-Tuning)`</td><td>AI Training</td><td>在已预训练好的基座模型权重上使用特定领域标注数据做进一步参数更新的训练过程</td><td>微调、细调</td></tr>\n<tr><td>59</td><td>**Guardrails**</td><td>`防护栏机制 / 安全护栏 (Guardrails)`</td><td>Security & Reliability</td><td>在模型输入前与输出后部署的规则过滤器与合规审查层，用于阻断越狱与恶意生成</td><td>公路围栏</td></tr>\n<tr><td>60</td><td>**Reproducibility**</td><td>`可复现性 / 可重现性`</td><td>Engineering Excellence</td><td>依据既定文档、脚本和配置，在异地干净环境中能够毫无差错地重新生成相同结果的能力</td><td>-</td></tr>\n<tr><td>61</td><td>**Syllabus**</td><td>`课程大纲与教学日历 (Syllabus)`</td><td>Curriculum</td><td>涵盖教学目标、分周进度、必读文献、作业实践与评分标准的全面导学规划表</td><td>-</td></tr>\n<tr><td>62</td><td>**Semantic Chunking**</td><td>`语义感知分块 (Semantic Chunking)`</td><td>Data Processing</td><td>根据代码函数边界、Markdown 标题或段落自然语义结构进行内容切分以避免割裂逻辑的技术</td><td>语意切片</td></tr>\n<tr><td>63</td><td>**Back-Translation**</td><td>`回译质检 (Back-Translation)`</td><td>AI Quality & Evaluation</td><td>将目标语言译文重新翻译回源语言并自动计算语义对齐度以发现漏译和幻觉的校验方法</td><td>倒译</td></tr>\n<tr><td>64</td><td>**Zero-Cost Reuse**</td><td>`零成本复用`</td><td>Engineering Excellence</td><td>后续学习者无需摸索配置或修补脚本，仅凭一键命令或清晰文档即可无缝接手运行成果的工程交付标准</td><td>-</td></tr>\n<tr><td>65</td><td>**Debug Loop**</td><td>`调试循环 (Debug Loop)`</td><td>AI Programming Paradigms</td><td>在 Vibe Coding 实践中以运行、报错、喂给 AI、修复、重复为核心的学习与构建引擎</td><td>查错环</td></tr>\n<tr><td>66</td><td>**ILT Production Studio**</td><td>`ILT 生产工作室`</td><td>Curriculum & Methodology</td><td>以产出物为中心、Agent 优先、占据 80% 实战时间的真实软件生产环节</td><td>-</td></tr>\n</tbody></table></div>"}];
    let currentId = catalog[0] ? catalog[0].id : '';

    function renderNav(filter = '') {
      const navList = document.getElementById('navList');
      navList.innerHTML = '';
      
      const categories = {};
      catalog.forEach(item => {
        if (filter) {
          const q = filter.toLowerCase();
          const matchTitle = item.title.toLowerCase().includes(q);
          const matchCat = item.category.toLowerCase().includes(q);
          if (!matchTitle && !matchCat) return;
        }
        if (!categories[item.category]) categories[item.category] = [];
        categories[item.category].push(item);
      });

      for (const [catName, items] of Object.entries(categories)) {
        const catHeader = document.createElement('div');
        catHeader.className = 'category-title';
        catHeader.textContent = catName;
        navList.appendChild(catHeader);

        items.forEach(item => {
          const a = document.createElement('a');
          a.className = 'nav-item' + (item.id === currentId ? ' active' : '');
          a.textContent = item.title;
          a.title = item.title;
          a.onclick = () => selectItem(item.id);
          navList.appendChild(a);
        });
      }
    }

    function selectItem(id) {
      currentId = id;
      const item = catalog.find(x => x.id === id);
      if (!item) return;

      document.getElementById('breadcrumbs').textContent = item.category + ' / ' + item.title;
      document.getElementById('contentView').innerHTML = item.html;
      
      // Update active nav class
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.textContent === item.title);
      });

      document.querySelector('.content-area').scrollTop = 0;
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderNav(e.target.value.trim());
    });

    // Init
    renderNav();
    if (catalog.length > 0) selectItem(catalog[0].id);
  </script>
